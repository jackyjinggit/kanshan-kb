<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看山 · 创作校准引擎（本地演示）</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2a323c;
    --fg:#e8edf3; --dim:#96a3b2; --accent:#4ea1ff; --accent2:#2b8a5b;
    --hi:#e0524a; --mid:#e0a24a; --low:#4a9ee0; --info:#7b8794;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:18px 22px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .tabs{display:flex;gap:8px;padding:12px 22px 0;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:9px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
       background:var(--panel2);color:var(--dim);cursor:pointer;font-size:14px}
  .tab.on{background:var(--bg);color:var(--fg);font-weight:600;border-color:var(--accent)}
  main{padding:20px 22px 40px;max-width:1180px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  label{color:var(--dim);font-size:13px}
  select,input,textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
       border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
  textarea{width:100%;min-height:200px;resize:vertical;line-height:1.6}
  button{background:var(--accent);color:#06121f;border:none;border-radius:8px;padding:10px 18px;
       font:inherit;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:600}
  button:disabled{opacity:.55;cursor:progress}
  .hint{color:var(--dim);font-size:12.5px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .b-高{background:rgba(224,82,74,.16);color:#ff8880;border:1px solid rgba(224,82,74,.5)}
  .b-中{background:rgba(224,162,74,.16);color:#f0b866;border:1px solid rgba(224,162,74,.5)}
  .b-低{background:rgba(74,158,224,.16);color:#7bbcff;border:1px solid rgba(74,158,224,.5)}
  .b-提示{background:rgba(123,135,148,.16);color:#aab5c1;border:1px solid rgba(123,135,148,.5)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .card h4{margin:0 0 8px;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card .sig{color:#dbe4ee;font-size:13.5px;margin:6px 0}
  .card ul{margin:6px 0 6px 18px;padding:0}
  .card li{margin:3px 0;font-size:13.5px}
  .card .mod{color:var(--accent);font-size:13px;font-weight:600}
  .card .basis,.card .fals{color:var(--dim);font-size:12.5px;margin-top:6px}
  .sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);
       border-radius:10px;padding:12px 14px;font-size:14px}
  .sum b{color:#fff}
  pre.md{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
       white-space:pre-wrap;word-break:break-word;font:13px/1.7 Consolas,"Courier New",monospace;
       max-height:560px;overflow:auto}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:12px 15px;margin-top:16px}
  summary{cursor:pointer;font-weight:600}
  .scorebar{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:4px 0 10px}
  .scorebar i{display:block;height:100%;background:linear-gradient(90deg,#4ea1ff,#2b8a5b)}
  .k{color:var(--dim)}
  .flag{background:rgba(224,162,74,.12);border:1px solid rgba(224,162,74,.45);border-radius:10px;
       padding:10px 13px;font-size:13px;margin:12px 0}
  .note{color:var(--dim);font-size:12.5px;margin-top:8px}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
  .err{background:rgba(224,82,74,.12);border:1px solid rgba(224,82,74,.5);border-radius:10px;padding:12px 14px}
  .hide{display:none}
  .big{font-size:30px;font-weight:800}
  .table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
  .table th,.table td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .table th{background:var(--panel2);color:var(--dim);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>看山 · 创作校准引擎 <span class="badge b-低">本地离线演示</span></h1>
  <div class="sub">入口一：账号诊断（合成演示数据）→ 七节诊断报告 + 处方单　|　入口二：<b>贴入式分析</b>——不需要任何账号授权，贴一段内容即可出诊断</div>
</header>

<div class="tabs">
  <div class="tab on" id="tabA" data-pane="paneA">① 账号诊断</div>
  <div class="tab" id="tabB" data-pane="paneB">② 贴入式内容分析</div>
</div>

<main>
  <!-- ===== 入口一：账号诊断 ===== -->
  <section id="paneA">
    <div class="row">
      <label>演示账号类型</label>
      <select id="arch"></select>
      <label>账号名</label>
      <input id="user" value="演示账号" style="width:130px">
      <label>窗口</label>
      <select id="days">
        <option value="30" selected>近 30 天</option>
        <option value="60">近 60 天</option>
        <option value="90">近 90 天</option>
      </select>
      <button id="btnDiag">生成诊断 + 处方</button>
      <span class="hint" id="archDesc"></span>
    </div>
    <div class="flag">数据说明：这里的账号数据由 <code>scripts/demo_synth.py</code> <b>合成生成</b>（用于现场演示与回归测试），不是任何真实账号的数据。真实数据入口是<code>scripts/zhihu_fetch.py</code> 拉取本人授权数据后跑同一套引擎。</div>
    <div id="diagOut"></div>
  </section>

  <!-- ===== 入口二：贴入式分析 ===== -->
  <section id="paneB" class="hide">
    <div class="row">
      <label>标题（可选）</label>
      <input id="pTitle" placeholder="例如：为什么你收藏了 300 篇干货" style="width:340px">
      <button class="ghost" data-demo="good">载入示例：结构较好</button>
      <button class="ghost" data-demo="risk">载入示例：风险较多</button>
      <button class="ghost" data-demo="link">载入示例：纯链接</button>
      <button id="btnAnalyze">开始分析</button>
    </div>
    <textarea id="pText" placeholder="把要分析的内容整段贴进来（标题、正文均可）……&#10;&#10;不需要账号授权，不需要登录，不读取任何本地文件。"></textarea>
    <div class="note">边界：纯空白 / 无正文无法分析；正文超过 2 万字只分析前 2 万字并在报告中标注；本工具不做平台违规判定，只做风险自查提示。</div>
    <div id="anOut"></div>
  </section>

  <footer id="status">正在读取引擎状态……</footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function inline(s){
  return s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
}
/* 极简 Markdown 渲染：先转义再套结构，贴入内容不会变成可执行标签 */
function renderMd(md){
  const lines = String(md).split(/\r?\n/);
  let out = [], i = 0;
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const isSep = (l) => /^\s*\|[\s:\-|]+\|\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g,"").split("|").map(c => inline(esc(c.trim())));
  while (i < lines.length){
    const l = lines[i];
    if (isRow(l)){
      let head = null, rows = [];
      if (i + 1 < lines.length && isSep(lines[i+1])){
        head = cells(l); i += 2;
      }
      while (i < lines.length && isRow(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<table class="table">' +
        (head ? "<thead><tr>" + head.map(c=>"<th>"+c+"</th>").join("") + "</tr></thead>" : "") +
        "<tbody>" + rows.map(r => "<tr>" + r.map(c=>"<td>"+c+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }
    if (/^\s*#{1,6}\s/.test(l)){
      const lvl = l.match(/^\s*(#{1,6})/)[1].length;
      out.push("<h" + (lvl+1) + ">" + inline(esc(l.replace(/^\s*#+\s*/,""))) + "</h" + (lvl+1) + ">");
    } else if (/^\s*[-*]\s/.test(l)){
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])){
        items.push("<li>" + inline(esc(lines[i].replace(/^\s*[-*]\s+/,""))) + "</li>"); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    } else if (/^\s*\d+[.)]\s/.test(l)){
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s/.test(lines[i])){
        items.push("<li>" + inline(esc(lines[i].replace(/^\s*\d+[.)]\s+/,""))) + "</li>"); i++;
      }
      out.push("<ol>" + items.join("") + "</ol>"); continue;
    } else if (!l.trim()){
      out.push("");
    } else {
      out.push("<p>" + inline(esc(l)) + "</p>");
    }
    i++;
  }
  return out.join("\n");
}

async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                              body: JSON.stringify(body)});
  let data;
  try { data = await r.json(); } catch(e){ throw new Error("服务返回不是 JSON（HTTP " + r.status + "）"); }
  if (!r.ok || data.ok === false) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

/* ---------- 入口一 ---------- */
let ARCH = {}, SEV = {};

function rxCard(r){
  const acts = (r.actions||[]).map(a => "<li>" + inline(esc(a)) + "</li>").join("");
  return '<div class="card">' +
    '<h4><span class="badge b-' + esc(r.severity) + '">' + esc(r.severity) + '</span>' +
    '<span>' + esc(r.id) + " · " + inline(esc(r.title)) + '</span></h4>' +
    '<div class="sig"><span class="k">异常信号：</span>' + inline(esc(r.signal)) + '</div>' +
    '<div class="mod">对应模块：' + esc(r.module) + (r.module_name ? "（"+esc(r.module_name)+"）" : "") + '</div>' +
    '<div class="k" style="margin-top:6px">具体动作：</div><ul>' + acts + '</ul>' +
    '<div class="basis">依据：' + esc(r.basis) + (r.basis_note ? "　" + inline(esc(r.basis_note)) : "") + '</div>' +
    '<div class="fals">失效条件：' + inline(esc(r.falsify)) + '</div>' +
    '</div>';
}

async function runDiagnose(){
  const btn = $("btnDiag"); btn.disabled = true; $("diagOut").innerHTML = "<p class='hint'>生成中……（合成数据 → 七节诊断 → 信号 → 处方）</p>";
  try{
    const d = await post("/api/diagnose", {user: $("user").value, archetype: $("arch").value,
                                           days: +$("days").value});
    const s = d.summary || {};
    const cnt = {};
    d.prescriptions.forEach(r => cnt[r.severity] = (cnt[r.severity]||0)+1);
    let html = '<div class="sum">' +
      '<span>账号：<b>' + esc(d.meta.user) + '</b>（' + esc(d.meta.archetype_label) + '）</span>' +
      '<span>样本：<b>' + d.meta.n_records + '</b> 条</span>' +
      '<span>窗口：近 <b>' + d.meta.days + '</b> 天</span>' +
      '<span>数据锚点：<b>' + esc(d.meta.time_anchor) + '</b></span>' +
      '<span>处方：<b>' + d.prescriptions.length + '</b> 条（高 ' + (cnt["高"]||0) + ' / 中 ' + (cnt["中"]||0) + ' / 低 ' + (cnt["低"]||0) + '）</span>' +
      '<span>数据：<b>' + esc(d.meta.data_kind) + '</b></span></div>';
    if (d.signals && d.signals.n_recent < 8){
      html += '<div class="flag">近期窗口只有 <b>' + d.signals.n_recent + '</b> 条样本（少于 8 条阈值）→ 引擎已<b>自动回退到全量基线</b>，并在报告与每张处方里声明。此时节奏/稳定性类结论不可采信：把窗口调大，或换一个近期有更新的账号类型。</div>';
    } else if (d.signals){
      html += '<div class="note">基线口径：' + esc(d.signals.baseline_kind) + '（' + d.signals.baseline.n + ' 条）</div>';
    }
    html += '<div class="cards">' + d.prescriptions.map(rxCard).join("") + '</div>';    html += '<details><summary>展开完整七节诊断报告（原始文本）</summary><div class="md">' +
            renderMd(d.report_md) + '</div></details>';
    $("diagOut").innerHTML = html;
  }catch(e){
    $("diagOut").innerHTML = '<div class="err"><b>出错了：</b>' + esc(e.message) + '</div>';
  }finally{ btn.disabled = false; }
}

/* ---------- 入口二 ---------- */
const EXAMPLES = {
  good: {title:"为什么你收藏了 300 篇干货，一篇也没用上？", text:
    "为什么你收藏了 300 篇干货，一篇也没用上？\n\n先说结论：收藏不是学习，收藏只是把焦虑存了个盘。\n\n" +
    "我去年也这样：收藏夹 300 多篇，真正复用的不到 5 篇。数据来自我自己的导出记录（共 312 条）：\n" +
    "- 当天处理的，复用率 41%\n- 3 天后处理的，复用率 6%\n\n" +
    "所以我用一个三步法替代了「先收藏再说」：第一步，立刻问这条能用在哪个正在进行的事情上；" +
    "第二步，当场写一句「我会用它做什么」；第三步，每周清一次收藏夹。\n\n" +
    "这个方法的边界要说清楚：它对工具型内容有效，对观点型内容不太适用。\n\n" +
    "你最近一次把收藏的内容真正用掉，是哪一篇？"},
  risk: {title:"全网最好的理财方法", text:
    "全网最好的理财方法，100% 稳赚，我保证你月入过万。加微信 zhuanqian888 拉你进群，" +
    "扫码进群还有福利。这个方子能彻底根治失眠，药到病除。三天学会，保证学会。" +
    "有问题打 13812345678。详见 https://example.com/post 。那些脑残杠精别来。"},
  link: {title:"", text:"https://zhuanlan.zhihu.com/p/123456789"}
};

async function runAnalyze(){
  const btn = $("btnAnalyze"); btn.disabled = true;
  $("anOut").innerHTML = "<p class='hint'>分析中……</p>";
  try{
    const d = await post("/api/analyze", {text: $("pText").value, title: $("pTitle").value});
    const comps = d.m4 && d.m4.components ? d.m4.components : {};
    let html = '<div class="sum">' +
      '<span>字数：<b>' + d.overview.chars_effective + '</b>' + (d.overview.chars_raw !== d.overview.chars_effective ? '（原文 ' + d.overview.chars_raw + '）' : '') + '</span>' +
      '<span>段数：<b>' + d.overview.paragraphs + '</b></span>' +
      '<span>链接：<b>' + d.overview.links + '</b></span>' +
      '<span>M4 得分：<b>' + (d.score == null ? "不可评分" : d.score + "/100") + '</b>' +
      (d.grade ? '（' + esc(d.grade) + '）' : '') + '</span>' +
      '<span>M10 风险：<b>' + d.m10.high + '</b> 高 / ' + d.m10.medium + ' 中</span></div>';

    if (d.score != null && Object.keys(comps).length){
      html += '<div class="cards">';
      for (const k of ["hook","emotion","punch","anchor"]){
        const c = comps[k]; if (!c) continue;
        const pct = c.max ? Math.round(c.score * 100 / c.max) : 0;
        html += '<div class="card"><h4>' + esc(c.label || k) + '　<span class="badge b-低">' + c.score + ' / ' + c.max + '</span></h4>' +
          '<div class="scorebar"><i style="width:' + pct + '%"></i></div>' +
          '<ul>' + (c.hits||[]).map(h => "<li>命中 " + esc(h.id) + " " + esc(h.label) + "</li>").join("") +
          (c.missed||[]).map(m => '<li class="k">未命中 ' + esc(m.id) + ' ' + esc(m.label) + '</li>').join("") + '</ul></div>';
      }
      html += '</div>';
    } else {
      html += '<div class="flag">该输入<b>不可评分</b>：没有可分析的正文（例如只贴了一条链接）。这不是 0 分，而是「给不出分数」——比编一个分数诚实。</div>';
    }

    if ((d.structure||[]).length){
      html += '<h3>结构诊断</h3><table class="table"><thead><tr><th>编号</th><th>级别</th><th>发现</th><th>建议</th></tr></thead><tbody>' +
        d.structure.map(f => "<tr><td>" + esc(f.id) + "</td><td><span class='badge b-" + esc(f.level) + "'>" + esc(f.level) + "</span></td><td>" + esc(f.name) + "——" + inline(esc(f.evidence)) + "</td><td>" + inline(esc(f.advice)) + "</td></tr>").join("") +
        "</tbody></table>";
    }
    if ((d.m10.hits||[]).length){
      html += '<h3>M10 合规风险自查</h3><table class="table"><thead><tr><th>级别</th><th>命中</th><th>出现</th><th>说明</th><th>建议</th></tr></thead><tbody>' +
        d.m10.hits.map(h => "<tr><td><span class='badge b-" + esc(h.level) + "'>" + esc(h.level) + "</span></td><td>" + esc(h.name) + "</td><td>" + h.n + " 处</td><td>" + inline(esc((h.evidence||[]).join("　/　"))) + "</td><td>" + inline(esc(h.advice)) + "</td></tr>").join("") +
        "</tbody></table>";
      html += '<div class="note">提示：合规项为<b>自查提示</b>，依据公开平台规范整理，不构成平台判定；最终以平台规则与人工审核为准。</div>';
    } else {
      html += '<div class="flag">M10 合规自查：未命中规则库中的风险模式。注意这不等于「一定合规」，只说明<b>当前规则库</b>里没有命中项。</div>';
    }
    html += '<details><summary>展开分析报告（含校验规则插槽与失效条件）</summary><div class="md">' +
            renderMd(d.markdown || "") + '</div></details>';
    $("anOut").innerHTML = html;
  }catch(e){
    $("anOut").innerHTML = '<div class="err"><b>无法分析：</b>' + esc(e.message) + '</div>';
  }finally{ btn.disabled = false; }
}

/* ---------- 初始化 ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  $("paneA").classList.toggle("hide", t.dataset.pane !== "paneA");
  $("paneB").classList.toggle("hide", t.dataset.pane !== "paneB");
});
document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => {
  const e = EXAMPLES[b.dataset.demo];
  $("pTitle").value = e.title; $("pText").value = e.text;
});
$("btnDiag").onclick = runDiagnose;
$("btnAnalyze").onclick = runAnalyze;

(async function init(){
  try{
    const r = await fetch("/api/status"); const s = await r.json();
    ARCH = s.archetypes || {}; SEV = s.severity_hint || {};
    $("arch").innerHTML = Object.keys(ARCH).map(k =>
      '<option value="' + esc(k) + '">' + esc(ARCH[k].label) + '</option>').join("");
    const desc = () => $("archDesc").textContent = (ARCH[$("arch").value]||{}).desc || "";
    $("arch").onchange = desc; desc();
    $("status").innerHTML =
      "<b>引擎状态</b>　Python " + esc(s.python) + "　|　处方规则族 " + s.prescription_rules + " 条　|　" +
      "校验规则插槽：" + esc(s.rules_slot.source) + (s.rules_slot.is_example ? ' <span class="badge b-中">当前为示例规则</span>' : ' <span class="badge b-低">已由设计组接管</span>') +
      "<div class='note'>" + esc(s.rules_slot.note) + "</div>" +
      "<div class='note'>" + esc(s.disclaimer) + "</div>" +
      "<div class='note'>本页离线运行：不联网、不读凭证文件、不上传任何内容；贴入的文本只在本次本地请求里处理。</div>";
  }catch(e){
    $("status").innerHTML = '<span class="err">读取引擎状态失败：' + esc(e.message) + '（请确认通过 python demo/server.py 启动后访问本页）</span>';
  }
  runDiagnose();
})();
</script>
</body>

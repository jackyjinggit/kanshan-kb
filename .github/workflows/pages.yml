name: Deploy demo to GitHub Pages

# 静态线（部署双线之①）：push main 即自动预渲染单文件演示页并发布到 GitHub Pages。
# 产物 = 离线零依赖 HTML（断网/无 Python 兜底），官方必交「可公开访问的线上 Demo」保底线。
# 动态线（之②）见 render.yaml（demo/server.py，需托管平台账号，配置已备好一键部署）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prerender single-file demo
        run: |
          python scripts/prerender_demo.py --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
